server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: p2p-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: p2p-logs
          __path__: /var/log/p2p/*.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            service: service
            category: category
            traceId: traceId
            actor: actor
            clientIp: clientIp
      - timestamp:
          source: timestamp
          format: UnixMs
      - labels:
          level:
          service:
          category:
