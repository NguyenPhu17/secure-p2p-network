global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "p2p-manager"
    metrics_path: /metrics
    static_configs:
      - targets: ["manager:4000"]

  - job_name: "p2p-peers"
    metrics_path: /metrics
    http_sd_configs:
      - url: "http://manager:4000/api/prometheus/targets"
        refresh_interval: 5s
