global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "p2p-peers"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "peer-1:3001"
          - "peer-2:3002"
          - "peer-3:3003"
          - "peer-4:3004"
