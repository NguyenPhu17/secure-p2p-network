services:
  postgres:
    image: postgres:15-alpine
    container_name: p2p-postgres
    restart: always
    environment:
      POSTGRES_DB: p2p_network
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 27082005
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - p2p-net

  manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2p-manager
    command: npm run manager
    ports:
      - "7000:7000"
      - "4000:4000"
    environment:
      - MANAGER_PORT=4000
      - REGISTRY_PORT=7000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=p2p_network
      - DB_USER=postgres
      - DB_PASSWORD=27082005
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    depends_on:
      - postgres
    networks:
      - p2p-net

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: p2p-ui
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - manager
    networks:
      - p2p-net

  # ==========================================
  # HỆ THỐNG GIÁM SÁT MONITORING (PROMETHEUS & GRAFANA)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: p2p-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - p2p-net

  grafana:
    image: grafana/grafana:latest
    container_name: p2p-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - p2p-net

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: p2p-node-exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - p2p-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: p2p-cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8088:8080"
    networks:
      - p2p-net

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  p2p-net:
    driver: bridge
