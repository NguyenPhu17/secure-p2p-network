services:
  postgres:
    image: postgres:15-alpine
    container_name: p2p-postgres
    restart: always
    environment:
      POSTGRES_DB: p2p_network
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 27082005
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - p2p-net

  registry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2p-registry
    command: npm run registry
    ports:
      - "7000:7000"
    environment:
      - REGISTRY_PORT=7000
    networks:
      - p2p-net

  peer-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2p-peer-1
    command: npx tsx peer/index.ts
    ports:
      - "8001:8001"
      - "3001:3001"
    environment:
      - PEER_NAME=Node-1
      - PEER_ADVERTISE_IP=peer-1
      - PEER_TCP_PORT=8001
      - PEER_UI_PORT=3001
      - DISCOVERY_MODE=dht
      - BOOTSTRAP_PEERS=
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=p2p_network
      - DB_USER=postgres
      - DB_PASSWORD=27082005
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    depends_on:
      - postgres
    networks:
      - p2p-net

  peer-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2p-peer-2
    command: npx tsx peer/index.ts
    ports:
      - "8002:8002"
      - "3002:3002"
    environment:
      - PEER_NAME=Node-2
      - PEER_ADVERTISE_IP=peer-2
      - PEER_TCP_PORT=8002
      - PEER_UI_PORT=3002
      - DISCOVERY_MODE=dht
      - BOOTSTRAP_PEERS=peer-1:8001,peer-3:8003
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=p2p_network
      - DB_USER=postgres
      - DB_PASSWORD=27082005
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    depends_on:
      - postgres
    networks:
      - p2p-net

  peer-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2p-peer-3
    command: npx tsx peer/index.ts
    ports:
      - "8003:8003"
      - "3003:3003"
    environment:
      - PEER_NAME=Node-3
      - PEER_ADVERTISE_IP=peer-3
      - PEER_TCP_PORT=8003
      - PEER_UI_PORT=3003
      - DISCOVERY_MODE=dht
      - BOOTSTRAP_PEERS=peer-2:8002,peer-1:8001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=p2p_network
      - DB_USER=postgres
      - DB_PASSWORD=27082005
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    depends_on:
      - postgres
    networks:
      - p2p-net

  peer-4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2p-peer-4
    command: npx tsx peer/index.ts
    ports:
      - "8004:8004"
      - "3004:3004"
    environment:
      - PEER_NAME=Node-4
      - PEER_ADVERTISE_IP=peer-4
      - PEER_TCP_PORT=8004
      - PEER_UI_PORT=3004
      - DISCOVERY_MODE=dht
      - BOOTSTRAP_PEERS=peer-1:8001,peer-2:8002
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=p2p_network
      - DB_USER=postgres
      - DB_PASSWORD=27082005
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    depends_on:
      - postgres
    networks:
      - p2p-net

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: p2p-ui
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - peer-1
      - peer-2
      - peer-3
      - peer-4
    networks:
      - p2p-net

  # ==========================================
  # HỆ THỐNG GIÁM SÁT MONITORING (PROMETHEUS & GRAFANA)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: p2p-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - p2p-net

  grafana:
    image: grafana/grafana:latest
    container_name: p2p-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - p2p-net

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: p2p-node-exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - p2p-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: p2p-cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8088:8080"
    networks:
      - p2p-net

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  p2p-net:
    driver: bridge
