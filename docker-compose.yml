services:
  registry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2p-registry
    command: npm run registry
    ports:
      - "7000:7000"
    environment:
      - REGISTRY_PORT=7000
    networks:
      - p2p-net

  peer-alice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2p-peer-alice
    command: npx tsx peer/index.ts
    ports:
      - "8001:8001"
      - "3001:3001"
    environment:
      - PEER_NAME=Alice
      - PEER_ADVERTISE_IP=peer-alice
      - PEER_TCP_PORT=8001
      - PEER_UI_PORT=3001
      - DISCOVERY_MODE=dht
      - BOOTSTRAP_PEERS=
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=p2p_network
      - DB_USER=postgres
      - DB_PASSWORD=27082005
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    networks:
      - p2p-net

  peer-bob:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2p-peer-bob
    command: npx tsx peer/index.ts
    ports:
      - "8002:8002"
      - "3002:3002"
    environment:
      - PEER_NAME=Bob
      - PEER_ADVERTISE_IP=peer-bob
      - PEER_TCP_PORT=8002
      - PEER_UI_PORT=3002
      - DISCOVERY_MODE=dht
      - BOOTSTRAP_PEERS=peer-alice:8001,peer-charlie:8003
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=p2p_network
      - DB_USER=postgres
      - DB_PASSWORD=27082005
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    networks:
      - p2p-net

  peer-charlie:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2p-peer-charlie
    command: npx tsx peer/index.ts
    ports:
      - "8003:8003"
      - "3003:3003"
    environment:
      - PEER_NAME=Charlie
      - PEER_ADVERTISE_IP=peer-charlie
      - PEER_TCP_PORT=8003
      - PEER_UI_PORT=3003
      - DISCOVERY_MODE=dht
      - BOOTSTRAP_PEERS=peer-bob:8002,peer-alice:8001
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=p2p_network
      - DB_USER=postgres
      - DB_PASSWORD=27082005
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    networks:
      - p2p-net

  peer-david:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2p-peer-david
    command: npx tsx peer/index.ts
    ports:
      - "8004:8004"
      - "3004:3004"
    environment:
      - PEER_NAME=David
      - PEER_ADVERTISE_IP=peer-david
      - PEER_TCP_PORT=8004
      - PEER_UI_PORT=3004
      - DISCOVERY_MODE=dht
      - BOOTSTRAP_PEERS=peer-alice:8001,peer-bob:8002
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=p2p_network
      - DB_USER=postgres
      - DB_PASSWORD=27082005
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    networks:
      - p2p-net

networks:
  p2p-net:
    driver: bridge
