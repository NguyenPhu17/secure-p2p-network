name: CI/CD Pipeline - Secure P2P Network

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  BACKEND_IMAGE: secure-p2p-backend
  UI_IMAGE: secure-p2p-ui

jobs:
  # ========================================================
  # JOB 1: Typecheck, Build, Compose Validate & Automated Tests
  # ========================================================
  ci-quality-and-tests:
    name: Typecheck, Build & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: p2p_network
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install Backend dependencies
        run: npm ci

      - name: Install Frontend UI dependencies
        working-directory: ./ui
        run: npm ci

      - name: TypeScript Typecheck (All Backend + Tests)
        run: npx tsc --noEmit

      - name: Build Backend Production Bundle (dist/)
        run: npm run build

      - name: Build Frontend UI (Vite + TypeScript)
        working-directory: ./ui
        run: npm run build

      - name: Validate Docker Compose Configuration
        env:
          DB_PASSWORD: ci_validate_only
          JWT_SECRET: ci_validate_only
        run: docker compose config --quiet

      - name: Run Kademlia DHT Unit Tests
        run: npm run test:dht:unit

      - name: Run Security Enhancements Tests (JWT, Brute-force, Password Policy)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: p2p_network
          DB_USER: postgres
          DB_PASSWORD: ci_test_password
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          npm run test:security

  # ========================================================
  # JOB 2: DevSecOps - Secret Scanning & Dependency Audit
  # ========================================================
  security-audit:
    name: Secret Scan & Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit Backend Production Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit Frontend Dependencies
        working-directory: ./ui
        run: npm audit --omit=dev --audit-level=high

  # ========================================================
  # JOB 3: Build Docker Images, Trivy CVE Scan & Push Registry
  # ========================================================
  build-and-scan-docker:
    name: Build, Scan & Push Docker Images
    needs: [ci-quality-and-tests, security-audit]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build UI Docker Image (Nginx Multi-stage)
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: false
          load: true
          tags: ${{ env.UI_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max

      - name: Scan Backend Image with Trivy (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan UI Image with Trivy (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.UI_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push Images to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
            docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} "$DH_USER/${{ env.BACKEND_IMAGE }}:latest"
            docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} "$DH_USER/${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
            docker tag ${{ env.UI_IMAGE }}:${{ github.sha }} "$DH_USER/${{ env.UI_IMAGE }}:latest"
            docker tag ${{ env.UI_IMAGE }}:${{ github.sha }} "$DH_USER/${{ env.UI_IMAGE }}:${{ github.sha }}"
            docker push "$DH_USER/${{ env.BACKEND_IMAGE }}:latest"
            docker push "$DH_USER/${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
            docker push "$DH_USER/${{ env.UI_IMAGE }}:latest"
            docker push "$DH_USER/${{ env.UI_IMAGE }}:${{ github.sha }}"
            echo "✅ Đã đẩy Docker Images lên Docker Hub thành công!"
          else
            echo "ℹ️ Chưa cấu hình DOCKERHUB_USERNAME / DOCKERHUB_TOKEN trong Secrets. Bỏ qua bước push."
          fi

  # ========================================================
  # JOB 4: Continuous Deployment (Pull-based + Auto Rollback)
  # Kích hoạt khi ENABLE_AUTO_DEPLOY=true và đã cấu hình SSH + Docker Hub Secrets
  # ========================================================
  cd-deploy-server:
    name: Deploy to Production Server
    needs: build-and-scan-docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_AUTO_DEPLOY == 'true'

    steps:
      - name: Pull-based Deploy & Health Verification via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          NEW_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DH_USER,DH_TOKEN,NEW_TAG
          script: |
            set -euo pipefail
            cd ~/secure-p2p-network
            git pull --ff-only origin main

            if [ -z "${DH_USER:-}" ]; then
              echo "❌ Thiếu DOCKERHUB_USERNAME để deploy pull-based."
              exit 1
            fi

            if [ -n "${DH_TOKEN:-}" ]; then
              echo "${DH_TOKEN}" | docker login -u "${DH_USER}" --password-stdin
            fi

            export BACKEND_IMAGE="${DH_USER}/secure-p2p-backend"
            export UI_IMAGE="${DH_USER}/secure-p2p-ui"
            PREV_TAG=$(cat .deployed_tag 2>/dev/null || echo "latest")

            export IMAGE_TAG="${NEW_TAG}"
            docker compose pull manager ui

            if ! docker compose up -d --no-build --wait; then
              echo "⚠️ Deploy tag ${NEW_TAG} thất bại! Đang rollback về tag ${PREV_TAG}..."
              export IMAGE_TAG="${PREV_TAG}"
              docker compose up -d --no-build --wait || true
              exit 1
            fi

            echo "${NEW_TAG}" > .deployed_tag
            docker image prune -f
