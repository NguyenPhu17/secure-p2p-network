server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ========================================================
    # 1. Central Auth & Node Manager API Gateway
    # ========================================================
    location /api/ {
        proxy_pass http://p2p-manager:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Request-ID' always;
    }

    # ========================================================
    # 2. Reverse Proxy cho HTTP API của các Peer Node
    # ========================================================
    location /peer-api/3001/ { rewrite ^/peer-api/3001/(.*) /$1 break; proxy_pass http://p2p-manager:3001; proxy_set_header Host $host; }
    location /peer-api/3002/ { rewrite ^/peer-api/3002/(.*) /$1 break; proxy_pass http://p2p-manager:3002; proxy_set_header Host $host; }
    location /peer-api/3003/ { rewrite ^/peer-api/3003/(.*) /$1 break; proxy_pass http://p2p-manager:3003; proxy_set_header Host $host; }
    location /peer-api/3004/ { rewrite ^/peer-api/3004/(.*) /$1 break; proxy_pass http://p2p-manager:3004; proxy_set_header Host $host; }
    location /peer-api/3005/ { rewrite ^/peer-api/3005/(.*) /$1 break; proxy_pass http://p2p-manager:3005; proxy_set_header Host $host; }
    location /peer-api/3006/ { rewrite ^/peer-api/3006/(.*) /$1 break; proxy_pass http://p2p-manager:3006; proxy_set_header Host $host; }

    location ~ ^/peer-api/(\d+)/(.*)$ {
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://p2p-manager:$1/$2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================================
    # 3. Reverse Proxy cho WebSocket của các Peer Node
    # ========================================================
    location /peer-ws/3001 { proxy_pass http://p2p-manager:3001/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "Upgrade"; proxy_set_header Host $host; proxy_read_timeout 86400s; }
    location /peer-ws/3002 { proxy_pass http://p2p-manager:3002/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "Upgrade"; proxy_set_header Host $host; proxy_read_timeout 86400s; }
    location /peer-ws/3003 { proxy_pass http://p2p-manager:3003/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "Upgrade"; proxy_set_header Host $host; proxy_read_timeout 86400s; }
    location /peer-ws/3004 { proxy_pass http://p2p-manager:3004/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "Upgrade"; proxy_set_header Host $host; proxy_read_timeout 86400s; }
    location /peer-ws/3005 { proxy_pass http://p2p-manager:3005/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "Upgrade"; proxy_set_header Host $host; proxy_read_timeout 86400s; }
    location /peer-ws/3006 { proxy_pass http://p2p-manager:3006/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "Upgrade"; proxy_set_header Host $host; proxy_read_timeout 86400s; }

    location ~ ^/peer-ws/(\d+)$ {
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://p2p-manager:$1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ========================================================
    # 4. Phục vụ React SPA (Single Page Application)
    # ========================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tối ưu hóa bộ nhớ đệm cho tài nguyên tĩnh
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Kích hoạt Gzip nén dữ liệu giúp tải trang cực nhanh
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cấu hình bảo mật HTTP Headers cơ bản
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}
