title = "Gitleaks Config - Secure P2P Network"

[extend]
useDefault = true

[[allowlists]]
description = "Allow explicit CI/example placeholder prefixes (never real secrets)"
regexes = [
  '''^(ci_test_|ci_validate_|change_this_).*'''
]

[[allowlists]]
description = "Allow placeholder values inside .env.example"
paths = [
  '''(^|/)\.env\.example$'''
]
